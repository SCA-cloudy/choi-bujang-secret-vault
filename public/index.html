<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    .login, .editor { margin: 22px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #162538; }
    .login h2, .editor h2 { margin: 0 0 12px; font-size: 18px; }
    .login form, .editor form { display: grid; gap: 10px; }
    .login input, .editor input, .editor textarea { padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #0d1623; color: #ecf4ff; font-size: 16px; font-family: inherit; }
    .login button, .editor button, .actions button { padding: 11px 14px; border: 0; border-radius: 10px; background: #5fd3c6; color: #06222a; font-size: 16px; font-weight: 700; cursor: pointer; }
    .editor .row, .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .editor .secondary, .actions button { background: #2c4259; color: #ecf4ff; }
    .actions { margin-top: 12px; }
    .actions button { padding: 8px 12px; font-size: 14px; }
    .login button:disabled, .editor button:disabled { opacity: .6; cursor: wait; }
    .login .state { margin: 0 0 12px; font-size: 16px; }
    .login .error, .editor .error { margin: 12px 0 0; font-size: 15px; color: #ffb4c0; min-height: 1.2em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 4단계 내 자료만 보이게 하기</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인한 사람만 자료를 볼 수 있고, 로그인해도 내가 쓴 자료만 보입니다. 다른 사람의 자료는 읽거나 고치거나 지울 수 없습니다.</div>
    <section class="login" aria-labelledby="login-title">
      <h2 id="login-title">로그인</h2>
      <p class="state" id="login-state">로그인하지 않은 상태입니다.</p>
      <form id="login-form">
        <input id="login-email" type="email" autocomplete="username" placeholder="이메일" required>
        <input id="login-password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
        <button id="login-submit" type="submit">로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p class="error" id="login-error" role="alert"></p>
    </section>
    <section class="editor" id="editor" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">가상 메모 쓰기</h2>
      <form id="note-form">
        <input id="note-title" maxlength="200" placeholder="제목" required>
        <textarea id="note-body" maxlength="5000" rows="3" placeholder="내용"></textarea>
        <div class="row">
          <button id="note-save" type="submit">추가</button>
          <button id="note-cancel" class="secondary" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p class="error" id="note-error" role="alert"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 가상 자료가 보입니다.</li></ul>
  </main>
  <script type="module">
    // 공식 Supabase SDK로 로그인한다. 아래 주소와 공개용(publishable) 키는 화면에 있어도 되는 값이다.
    // 서버 전용 비밀키는 절대 이 파일에 넣지 않는다.
    const SUPABASE_URL = 'https://pznzzrrveegqazhdrzkc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_19si3Ptgf--ezUKk7k4ZrQ_NuTcuDSk';
    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#login-email');
    const passwordInput = document.querySelector('#login-password');
    const submit = document.querySelector('#login-submit');
    const logout = document.querySelector('#logout-button');
    const stateText = document.querySelector('#login-state');
    const errorText = document.querySelector('#login-error');
    const list = document.querySelector('#notes');
    const editor = document.querySelector('#editor');
    const noteForm = document.querySelector('#note-form');
    const titleInput = document.querySelector('#note-title');
    const bodyInput = document.querySelector('#note-body');
    const saveButton = document.querySelector('#note-save');
    const cancelButton = document.querySelector('#note-cancel');
    const noteError = document.querySelector('#note-error');
    let session = null;
    let editingId = null;
    let loadTurn = 0;

    function showMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    function messageFor(status) {
      if (status === 401) return '로그인을 확인하지 못했습니다. 다시 로그인해 주세요.';
      if (status === 404) return '이미 없는 메모입니다.';
      if (status === 400) return '제목은 1~200자, 내용은 5000자까지 쓸 수 있습니다.';
      return '처리하지 못했습니다. 잠시 뒤에 다시 해 주세요.';
    }

    // 로그인한 사람의 토큰을 서버에 함께 보낸다. 토큰이 없으면 요청하지 않는다.
    async function callApi(method, path, payload) {
      const token = session?.access_token;
      if (!token) return { ok: false, status: 401 };
      const headers = { Authorization: `Bearer ${token}` };
      const options = { method, cache: 'no-store', headers };
      if (payload) {
        headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(payload);
      }
      try {
        const response = await fetch(path, options);
        const data = await response.json().catch(() => null);
        return { ok: response.ok, status: response.status, data };
      } catch {
        return { ok: false, status: 0 };
      }
    }

    function resetEditor() {
      editingId = null;
      noteForm.reset();
      saveButton.textContent = '추가';
      cancelButton.hidden = true;
    }

    function startEdit(note) {
      editingId = note.id;
      titleInput.value = note.title;
      bodyInput.value = note.body;
      saveButton.textContent = '수정 저장';
      cancelButton.hidden = false;
      noteError.textContent = '';
      titleInput.focus();
    }

    function renderNotes(notes) {
      if (!notes.length) {
        showMessage('아직 메모가 없습니다. 위에서 추가해 보세요.');
        return;
      }
      list.replaceChildren(...notes.map(note => {
        const item = document.createElement('li');
        const title = document.createElement('strong');
        const content = document.createElement('span');
        const actions = document.createElement('div');
        const edit = document.createElement('button');
        const remove = document.createElement('button');
        title.textContent = note.title;
        content.textContent = note.body;
        actions.className = 'actions';
        edit.type = 'button';
        edit.textContent = '수정';
        edit.addEventListener('click', () => startEdit(note));
        remove.type = 'button';
        remove.textContent = '삭제';
        remove.addEventListener('click', () => removeNote(note));
        actions.append(edit, remove);
        item.append(title, content, actions);
        return item;
      }));
    }

    async function loadNotes() {
      const turn = ++loadTurn;
      if (!session?.access_token) {
        showMessage('로그인하면 가상 자료가 보입니다.');
        return;
      }
      showMessage('가상 자료를 불러오는 중입니다.');
      const result = await callApi('GET', '/api/notes');
      if (turn !== loadTurn) return;
      if (!result.ok) showMessage(messageFor(result.status));
      else if (!Array.isArray(result.data)) showMessage('자료 형식이 맞지 않습니다.');
      else renderNotes(result.data);
    }

    async function removeNote(note) {
      if (!window.confirm('이 메모를 지울까요?')) return;
      noteError.textContent = '';
      const result = await callApi('DELETE', `/api/notes/${encodeURIComponent(note.id)}`);
      if (!result.ok && result.status !== 404) {
        noteError.textContent = messageFor(result.status);
        return;
      }
      if (editingId === note.id) resetEditor();
      await loadNotes();
    }

    function showSignedIn() {
      const signedIn = Boolean(session?.user);
      stateText.textContent = signedIn
        ? `로그인됨: ${session.user.email ?? '계정'}`
        : '로그인하지 않은 상태입니다.';
      form.hidden = signedIn;
      logout.hidden = !signedIn;
      editor.hidden = !signedIn;
      if (!signedIn) {
        resetEditor();
        noteError.textContent = '';
      }
    }

    function reasonFor(error) {
      const code = error?.code ?? '';
      if (code === 'invalid_credentials') return '이메일이나 비밀번호가 맞지 않습니다.';
      if (code === 'email_not_confirmed') return '이메일 인증이 아직 끝나지 않은 계정입니다.';
      if (code === 'over_request_rate_limit' || error?.status === 429) return '시도가 너무 많습니다. 잠시 뒤에 다시 해 주세요.';
      return '로그인하지 못했습니다. 잠시 뒤에 다시 해 주세요.';
    }

    noteForm.addEventListener('submit', async event => {
      event.preventDefault();
      noteError.textContent = '';
      saveButton.disabled = true;
      const payload = { title: titleInput.value.trim(), body: bodyInput.value };
      const result = editingId
        ? await callApi('PUT', `/api/notes/${encodeURIComponent(editingId)}`, { id: editingId, ...payload })
        : await callApi('POST', '/api/notes', payload);
      saveButton.disabled = false;
      if (!result.ok) {
        noteError.textContent = messageFor(result.status);
        return;
      }
      resetEditor();
      await loadNotes();
    });

    cancelButton.addEventListener('click', () => {
      resetEditor();
      noteError.textContent = '';
    });

    try {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      const { data } = await supabase.auth.getSession();
      session = data.session;
      showSignedIn();
      loadNotes();
      supabase.auth.onAuthStateChange((_event, nextSession) => {
        session = nextSession;
        showSignedIn();
        loadNotes();
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        errorText.textContent = '';
        submit.disabled = true;
        const { error } = await supabase.auth.signInWithPassword({
          email: emailInput.value.trim(),
          password: passwordInput.value,
        });
        passwordInput.value = '';
        submit.disabled = false;
        if (error) errorText.textContent = reasonFor(error);
      });

      logout.addEventListener('click', async () => {
        errorText.textContent = '';
        const { error } = await supabase.auth.signOut();
        if (error) errorText.textContent = '로그아웃하지 못했습니다. 잠시 뒤에 다시 해 주세요.';
      });
    } catch {
      form.hidden = true;
      errorText.textContent = '로그인 기능을 불러오지 못했습니다. 새로고침해 주세요.';
      showMessage('로그인 기능을 불러오지 못해 자료를 볼 수 없습니다.');
    }
  </script>
</body>
</html>
